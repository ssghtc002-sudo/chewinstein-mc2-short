<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What if E ≠ mc²? — The Chewinstein Theory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d111a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "DejaVu Sans", sans-serif;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      background: #141926;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #webgl-canvas { z-index: 1; }
    #hud-canvas { z-index: 2; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="webgl-canvas" width="1080" height="1920"></canvas>
    <canvas id="hud-canvas" width="1080" height="1920"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
